name: Provision t3.micro EC2

on:
  workflow_dispatch:
    inputs:
      ec2-name:
        description: EC2 name
        required: true
        default: 'App Server'
        type: string
      operation:
        description: 'Action to perform for the EC2 resource (select "create" or "destroy")'
        required: true
        default: 'create'
        options:
          - create
          - destroy
jobs:
  provision-ec2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '14'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: '${{ secrets.TF_USER_AWS_KEY }}'
          aws-secret-access-key: '${{ secrets.TF_USER_AWS_SECRET }}'
          aws-region: us-east-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      - name: Show chosen operation
        run: |
          echo "EC2 name: ${{ github.event.inputs.ec2-name }}"
          echo "Operation: ${{ github.event.inputs.operation }}"
      - name: Terraform action (create or destroy)
        id:   tf-action
        env:
          TF_VAR_ec2_name:  "${{ github.event.inputs.ec2-name }}"
        run: |
          set -euo pipefail
          cd tf-example/
          terraform init
          terraform validate

          if [ "${{ github.event.inputs.operation }}" = "destroy" ]; then
            echo "Running terraform plan (destroy) and terraform destroy..."
            terraform plan -destroy -out=tfplan_destroy
            terraform destroy -auto-approve
          else
            echo "Running terraform plan and terraform apply..."
            terraform plan -out=tfplan
            terraform apply -auto-approve
          fi
     
